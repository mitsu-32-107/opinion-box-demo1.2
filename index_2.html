<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>学友会執行委員会 意見箱ポータル（学生用）</title>
  <style>
    :root { --primary: #0068B7; --bg-color: #f3f4f6; --card-bg: #ffffff; --text-main: #1f2937; --border: #e5e7eb; }
    
    html, body { 
      font-family: sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      margin: 0; 
      padding: 0; 
    }
    
    .top-banner {
      position: sticky;
      top: 0;
      height: 70px;
      background-color: var(--card-bg);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      box-sizing: border-box;
    }
    .top-banner h1 { margin: 0 0 2px 0; font-size: 1.3rem; color: var(--primary); }
    .top-banner p { margin: 0; font-size: 0.8rem; color: #6b7280; text-align: center; padding: 0 10px; }

    .app-container { max-width: 1080px; margin: 0 auto; padding: 16px 20px; box-sizing: border-box; }
    
    .grid-layout { display: flex; flex-direction: column; gap: 20px; }
    
    .form-section, .faq-section {
      background-color: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 16px 20px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }

    .faq-section {
      display: flex;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      html, body { 
        height: 100vh; 
        overflow: hidden; 
      }
      .app-container { 
        height: calc(100vh - 70px); 
      }
      .grid-layout { 
        flex-direction: row; 
        align-items: stretch; 
        height: 100%; 
      }
      .form-section { 
        flex: 1.2; 
        overflow-y: auto; 
        height: 100%; 
        margin-bottom: 0;
      }
      .faq-section { 
        flex: 1; 
        height: 100%; 
        margin-bottom: 0;
      }
      #public-list {
        flex: 1;
        overflow-y: auto;
        padding-right: 4px;
        margin-top: 8px;
      }
    }

    .rule-box { background-color: #eff6ff; border-left: 4px solid var(--primary); padding: 10px 12px; margin-bottom: 12px; border-radius: 0 8px 8px 0; font-size: 0.8rem; color: #334155; }
    .rule-box strong { color: #1e40af; display: block; margin-bottom: 4px; font-size: 0.9rem;}
    .rule-box ul { margin: 0; padding-left: 18px; line-height: 1.4; }
    .rule-box li { margin-bottom: 2px; }

    .form-group { margin-bottom: 10px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
    .badge-req { background-color: #ef4444; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    .badge-opt { background-color: #6b7280; color: white; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; margin-left: 6px; }
    
    .tooltip-container {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      background-color: #94a3b8;
      color: white;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: help;
      margin-left: 6px;
      vertical-align: middle;
    }
    .tooltip-container .tooltip-text {
      visibility: hidden;
      width: 220px;
      background-color: #1e293b;
      color: #fff;
      text-align: left;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.75rem;
      font-weight: normal;
      line-height: 1.4;
      position: absolute;
      z-index: 100;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      opacity: 0;
      transition: opacity 0.2s;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
    }
    .tooltip-container .tooltip-text::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;
      margin-left: -5px;
      border-width: 5px;
      border-style: solid;
      border-color: #1e293b transparent transparent transparent;
    }
    .tooltip-container:hover .tooltip-text {
      visibility: visible;
      opacity: 1;
    }

    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; box-sizing: border-box; }
    textarea { resize: none; font-family: inherit; }
    
    .radio-group { display: flex; gap: 16px; margin-top: 2px; }
    .radio-label { font-weight: normal; font-size: 0.9rem; display: flex; align-items: center; gap: 4px; cursor: pointer; }

    .submit-btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 10px; font-size: 1rem; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; margin-top: 4px;}
    .submit-btn:hover { background-color: #1d4ed8; }
    
    .section-title { font-size: 1.1rem; color: #374151; margin-top: 0; margin-bottom: 10px; border-bottom: 2px solid var(--primary); padding-bottom: 6px; display: inline-block; }
    
    .faq-sticky-header {
      flex-shrink: 0;
      background-color: var(--card-bg);
      z-index: 10;
    }

    .search-bar { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
    .search-inputs { display: flex; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
    .search-inputs input, .search-inputs select { padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem; }
    .search-inputs input { flex: 2; min-width: 120px; }
    .search-inputs select { flex: 1; min-width: 90px; }
    
    .reset-btn { padding: 6px 10px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 6px; cursor: pointer; font-size: 0.80rem; color: #475569; font-weight: bold; white-space: nowrap; transition: 0.2s; }
    .reset-btn:hover { background-color: #f1f5f9; color: #1e293b; }
    
    .faq-count { font-size: 0.8rem; font-weight: bold; color: #047857; background: #d1fae5; display: inline-block; padding: 2px 10px; border-radius: 20px; }

    .faq-item-card { background-color: #f8fafc; border: 1px solid #e2e8f0; padding: 14px; border-radius: 8px; margin-bottom: 12px; }
    .faq-question { font-weight: bold; border-left: 4px solid var(--primary); padding-left: 10px; margin-bottom: 8px; color: #1f2937; font-size: 0.9rem;}
    .faq-answer { background-color: #eff6ff; padding: 12px; border-radius: 8px; color: #1e3a8a; font-size: 0.85rem; line-height: 1.5; }
    
    .tag { font-size: 0.7rem; padding: 4px 8px; border-radius: 20px; font-weight: bold; display: inline-block; margin-bottom: 6px; margin-right: 4px; }
    .tag-target { background-color: #dbeafe; color: #1e40af; }
    .tag-gakuyukai { background-color: #fee2e2; color: #991b1b; }
    .tag-facility { background-color: #e0f2fe; color: #0369a1; }
    .tag-class { background-color: #dcfce7; color: #166534; }
    .tag-other { background-color: #f1f5f9; color: #475569; }
  </style>
</head>
<body>

  <header class="top-banner">
    <h1>学友会執行委員会 意見箱ポータル</h1>
    <p>より良い大学生活のために、ご意見をお寄せください。</p>
  </header>

  <div class="app-container">
    <div class="grid-layout">
      <!-- 左側：フォーム -->
      <section class="form-section">
        <h2 class="section-title">意見・要望を送信する</h2>
        
        <div class="rule-box">
          <strong>【ご意見の取り扱いについて】</strong>
          <ul>
            <li>いただいたご意見は、原則として「回答一覧」にて公開されます。</li>
            <li>個人情報を含む内容などは全体公開を控え、入力されたメールアドレス宛に直接ご返答いたします。</li>
            <li>情報共有やご報告など、返答を必要としないご意見もお気軽にお寄せください。</li>
          </ul>
        </div>

        <form id="opinionForm" onsubmit="submitOpinion(event)">
          
          <div class="form-group">
            <label>
              返答の希望<span class="badge-req">必須</span>
              <span class="tooltip-container">?
                <span class="tooltip-text">「希望する」を選ぶと、委員会からの返答が公開またはメールに届きます。「共有のみ」は意見の送信（情報共有）だけで返答を求めない場合に選択します。</span>
              </span>
            </label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="replyPref" value="希望する" checked> 希望する
              </label>
              <label class="radio-label">
                <input type="radio" name="replyPref" value="希望しない（共有のみ）"> 希望しない（共有のみ）
              </label>
            </div>
          </div>

          <div style="display: flex; gap: 12px;">
            <div class="form-group" style="flex: 1;">
              <label>あて先<span class="badge-req">必須</span></label>
              <select id="target" required>
                <option value="" disabled selected>選択してください</option>
                <option value="大学（教職員宛）">大学（教職員宛）</option>
                <option value="学友会執行委員会宛">学友会執行委員会宛</option>
              </select>
            </div>
            <div class="form-group" style="flex: 1;">
              <label>カテゴリ<span class="badge-req">必須</span></label>
              <select id="category" required onchange="toggleCategoryOther()">
                <option value="" disabled selected>選択してください</option>
                <option value="施設・設備について">施設・設備について</option>
                <option value="授業・履修について">授業・履修について</option>
                <option value="学友会活動について">学友会活動について</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>
          <input type="text" id="category-other" maxlength="20" placeholder="具体的なカテゴリ（20文字以内）" style="display:none; margin-bottom: 10px;">
          
          <div class="form-group">
            <label>意見・要望の内容<span class="badge-req">必須</span></label>
            <textarea id="content" rows="3" required placeholder="具体的な内容を記入してください。"></textarea>
          </div>

          <hr style="border:0; border-top:1px solid #e5e7eb; margin: 10px 0;">
          <p style="font-size:0.75rem; color:#6b7280; margin-bottom:6px;">※個別返答を希望する場合は以下も入力してください。</p>

          <div style="display: flex; gap: 12px; margin-bottom: 8px;">
            <div style="flex: 1;">
              <label>所属・学年<span class="badge-opt">任意</span></label>
              <select id="grade">
                <option value="未回答">選択しない</option>
                <option value="学部生">学部生</option>
                <option value="大学院生">大学院生</option>
                <option value="教職員">教職員</option>
              </select>
            </div>
            <div style="flex: 1;">
              <label>性別<span class="badge-opt">任意</span></label>
              <select id="gender">
                <option value="未回答">選択しない</option>
                <option value="男性">男性</option>
                <option value="女性">女性</option>
                <option value="その他">その他</option>
              </select>
            </div>
          </div>

          <div style="display: flex; gap: 12px; margin-bottom: 8px;">
            <div style="flex: 1;">
              <label>氏名<span class="badge-opt">任意</span></label>
              <input type="text" id="userName" placeholder="例：千葉 太郎">
            </div>
            <div style="flex: 2;">
              <label>連絡先（メール）<span class="badge-opt">任意</span></label>
              <input type="email" id="email" placeholder="例：example@example.com">
            </div>
          </div>

          <button type="submit" class="submit-btn">意見を送信する</button>
        </form>
      </section>

      <!-- 右側：回答一覧 -->
      <section class="faq-section">
        <div class="faq-sticky-header">
          <h2 class="section-title" style="border-color: #8b5cf6; color: #4c1d95; margin-bottom: 6px;">公開された回答一覧</h2>
          
          <div class="search-bar">
            <div class="search-inputs">
              <input type="text" id="faq-search" placeholder="キーワード検索" oninput="renderPublicFAQ()">
              <select id="faq-month" onchange="renderPublicFAQ()">
                <option value="all">全期間</option>
              </select>
              <select id="faq-sort" onchange="renderPublicFAQ()">
                <option value="new">新しい順</option>
                <option value="old">古い順</option>
              </select>
              <select id="faq-category" onchange="renderPublicFAQ()">
                <option value="all">全カテゴリ</option>
                <option value="施設・設備について">施設・設備について</option>
                <option value="授業・履修について">授業・履修について</option>
                <option value="学友会活動について">学友会活動について</option>
                <option value="その他">その他</option>
              </select>
              <select id="faq-target" onchange="renderPublicFAQ()">
                <option value="all">全あて先</option>
                <option value="大学（教職員宛）">大学（教職員宛）</option>
                <option value="学友会執行委員会宛">学友会執行委員会宛</option>
              </select>
              <button type="button" class="reset-btn" onclick="resetFaqFilters()">↺ リセット</button>
            </div>
            <div id="faq-count-display" class="faq-count" style="margin-top: 4px;">公開中の回答: 0件</div>
          </div>
        </div>

        <div id="public-list"></div>
      </section>
    </div>
  </div>

<script>
  // =========================================================================
  // 1. 設定（GASのURL）
  // =========================================================================
  // ★ここに、先ほど発行した「ウェブアプリのURL」を貼り付けてください。
  const endpoint = "https://script.google.com/macros/s/AKfycbyUhCh2RZ3tlUOPk--2xFuzl29eWO0reU8XR9da4vnfy1RK3IfnyrhnzthF3DPmVqS1VQ/exec";

  // スプレッドシートから読み込んだ全データを一時保存する変数
  let globalOpinions = [];

  // =========================================================================
  // 2. フォームUIの制御関数
  // =========================================================================
  function toggleCategoryOther() {
    const cat = document.getElementById('category').value;
    const otherInput = document.getElementById('category-other');
    if(cat === 'その他') {
      otherInput.style.display = 'block';
      otherInput.required = false; 
    } else {
      otherInput.style.display = 'none';
      otherInput.required = false;
      otherInput.value = "";
    }
  }

  function resetFaqFilters() {
    document.getElementById('faq-search').value = "";
    document.getElementById('faq-month').value = "all";
    document.getElementById('faq-category').value = "all";
    document.getElementById('faq-target').value = "all";
    document.getElementById('faq-sort').value = "new";
    renderPublicFAQ();
  }

  // =========================================================================
  // 3. 意見の送信処理（GASへ全13項目をPOST送信）
  // =========================================================================
  function submitOpinion(e) {
    e.preventDefault();

    // スパム・いたずら連打防止（ボタンをロック）
    const submitBtn = document.querySelector('.submit-btn');
    submitBtn.disabled = true;
    submitBtn.innerText = "送信中...（数秒お待ちください）";
    submitBtn.style.backgroundColor = "#9ca3af";
    
    let finalCategory = document.getElementById('category').value;
    if (finalCategory === 'その他') {
      const otherText = document.getElementById('category-other').value.trim();
      finalCategory = otherText ? `その他（${otherText}）` : 'その他';
    }

    const replyPref = document.querySelector('input[name="replyPref"]:checked').value;
    const rawContent = document.getElementById('content').value;
    const combinedContent = `【返答の希望：${replyPref}】\n\n${rawContent}`;

    // スプレッドシートに送るデータ（全13項目のうち、送信時に必要な情報）
    const newOpinion = {
      id: Date.now(),
      date: new Date().toLocaleString('ja-JP'),
      target: document.getElementById('target').value,
      category: finalCategory,
      content: combinedContent,
      grade: document.getElementById('grade').value,
      gender: document.getElementById('gender').value,
      name: document.getElementById('userName').value || "匿名",
      email: document.getElementById('email').value || "なし",
      status: "未処理（確認待ち）"
    };

    fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' }, 
      body: JSON.stringify(newOpinion)
    })
    .then(response => response.json())
    .then(data => {
      if(data.status === "success") {
        alert("送信が完了しました！ご意見ありがとうございます。");
        document.getElementById('opinionForm').reset();
        toggleCategoryOther();
        
        // 送信が完了したら、FAQ一覧も最新状態に読み込み直す
        fetchOpinionsAndRender();
      } else {
        alert("保存に失敗しました。\nエラー詳細: " + data.message);
      }
    })
    .catch(error => {
      alert("通信エラーが発生しました。インターネット接続を確認してください。");
      console.error('Error:', error);
    })
    .finally(() => {
      // 10秒間は連続送信を禁止
      submitBtn.innerText = "10秒後に連続送信が可能になります...";
      setTimeout(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "意見を送信する";
        submitBtn.style.backgroundColor = ""; 
      }, 10000); 
    });
  }

  // =========================================================================
  // 4. スプレッドシートからの読み込み（GET）と表示
  // =========================================================================
  
  function getCategoryTagClass(categoryName) {
    if (!categoryName) return 'tag-other';
    if (categoryName.includes('学友会活動') || categoryName.includes('学友会')) return 'tag-gakuyukai'; 
    if (categoryName.includes('施設') || categoryName.includes('設備')) return 'tag-facility'; 
    if (categoryName.includes('授業') || categoryName.includes('履修')) return 'tag-class'; 
    return 'tag-other'; 
  }

  // ★スプレッドシート（GAS）からデータを取得する関数
  function fetchOpinionsAndRender() {
    const listContainer = document.getElementById('public-list');
    listContainer.innerHTML = `<p style="text-align:center; color:#3b82f6; margin-top:20px;">⏳ データを読み込み中...</p>`;
    
    // GASのURLにアクセスしてデータを取得
    fetch(endpoint)
      .then(response => response.json())
      .then(data => {
        // 取得したデータをグローバル変数に保存
        globalOpinions = data;
        // 画面に描画
        renderPublicFAQ();
      })
      .catch(error => {
        listContainer.innerHTML = `<p style="text-align:center; color:#ef4444; margin-top:20px;">データの読み込みに失敗しました。</p>`;
        console.error('Fetch Error:', error);
      });
  }

  // 取得したデータを画面（FAQ）に表示する関数
  function renderPublicFAQ() {
    const listContainer = document.getElementById('public-list');
    listContainer.innerHTML = ""; 

    // ステータスが「公開済み」のものだけを抽出
    let publicOpinions = globalOpinions.filter(op => op.status === "公開済み");

    const monthSelect = document.getElementById('faq-month');
    const currentMonthVal = monthSelect.value;
    const months = new Set();
    
    publicOpinions.forEach(op => {
      if (op.publishDate) {
        const d = new Date(op.publishDate);
        if (!isNaN(d.getTime())) {
          const yyyy = d.getFullYear();
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          months.add(`${yyyy}-${mm}`);
        }
      }
    });

    const sortedMonths = Array.from(months).sort().reverse();
    monthSelect.innerHTML = '<option value="all">全期間</option>';
    sortedMonths.forEach(m => {
      const [yyyy, mm] = m.split('-');
      const option = document.createElement('option');
      option.value = m; 
      option.textContent = `${yyyy}年${parseInt(mm, 10)}月`; 
      if (m === currentMonthVal) option.selected = true; 
      monthSelect.appendChild(option);
    });

    const searchKeyword = document.getElementById('faq-search').value.toLowerCase();
    const searchMonth = document.getElementById('faq-month').value;
    const searchCategory = document.getElementById('faq-category').value;
    const searchTarget = document.getElementById('faq-target').value;
    const sortOrder = document.getElementById('faq-sort').value;

    if (searchMonth !== 'all') {
      publicOpinions = publicOpinions.filter(op => {
        if (!op.publishDate) return false;
        const d = new Date(op.publishDate);
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        return `${yyyy}-${mm}` === searchMonth;
      });
    }

    if (searchCategory !== 'all') {
      publicOpinions = publicOpinions.filter(op => (op.category || "").includes(searchCategory));
    }
    
    if (searchTarget !== 'all') {
      publicOpinions = publicOpinions.filter(op => op.target === searchTarget);
    }

    if (searchKeyword) {
      publicOpinions = publicOpinions.filter(op => 
        (op.content || "").toLowerCase().includes(searchKeyword) || 
        (op.replyText || "").toLowerCase().includes(searchKeyword)
      );
    }

    publicOpinions.sort((a, b) => {
      let dateA = new Date(a.publishDate || a.date);
      let dateB = new Date(b.publishDate || b.date);
      return sortOrder === 'new' ? dateB - dateA : dateA - dateB;
    });

    document.getElementById('faq-count-display').innerText = `公開中の回答: ${publicOpinions.length}件`;

    if(publicOpinions.length === 0) {
      let emptyMessage = searchKeyword || searchMonth !== 'all' || searchCategory !== 'all' || searchTarget !== 'all'
        ? "該当する回答が見つかりませんでした。" 
        : "現在、公開されている回答はありません。";
      listContainer.innerHTML = `<div style="text-align:center; color:#6b7280; padding: 20px;">${emptyMessage}</div>`;
      return;
    }

    publicOpinions.forEach(op => {
      const card = document.createElement('div');
      card.className = 'faq-item-card';
      
      let publishDateHtml = op.publishDate ? `<div style="font-size: 0.85rem; color: #059669; font-weight: bold; margin-bottom: 6px;">🗓 回答公開日: ${op.publishDate}</div>` : "";
      
      // 未定義エラーを防ぐ
      let rawContent = op.content || "";
      let displayContent = rawContent.replace(/【(?:回答|返答)の希望：.*?】\n\n/, '');
      
      let catTagClass = getCategoryTagClass(op.category);
      let targetTagClass = (op.target && op.target.includes('学友会')) ? 'tag-gakuyukai' : 'tag-target';

      card.innerHTML = `
        <div>
          <span class="tag ${targetTagClass}">宛先: ${op.target}</span>
          <span class="tag ${catTagClass}">${op.category}</span>
        </div>
        <div class="faq-question">
          <span style="font-size: 0.8rem; color: #6b7280; font-weight: normal;">投稿日: ${op.date}</span><br>
          【学生からの意見】<br>${displayContent}
        </div>
        <div class="faq-answer">
          ${publishDateHtml}
          <strong>【${(op.target || "").replace('宛', '')}からの回答】</strong><br>${op.replyText || "回答はまだありません。"}
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  // ページ読み込み時に、まずGASからデータを取得してFAQを描画する
  fetchOpinionsAndRender();
</script>
</body>
</html>
